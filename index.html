<!doctype html>
<!-- data-splash-intro="light" ＝「白起」開場（v1.6.0）。理由寫在下面關鍵路徑 CSS 那一塊。
     ⚠️ 必須靜態寫在這裡：用 JS 加的時候第一幀已經畫過了，而且不會報錯。 -->
<html lang="zh-Hant" data-splash-intro="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="一頁看完一部片值不值得看：TMDB、IMDb、爛番茄、Metacritic 分數與台灣哪裡看得到。">
<title>好雷嗎?</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="好雷嗎">
<!-- ⭐⭐ 關鍵路徑：第一次繪製就必須是深色的開場。這一塊刻意排在所有 <link> 之前，
     而且**不依賴任何外部檔案**（顏色走 var(--splash-*, 後備值)）。
     為什麼要有它：iPhone 從主畫面開 PWA 的順序是
       系統開場（manifest.background_color ＋ icon）→ 建 WKWebView → **這裡是白的** → 頁面第一次繪製。
     三支外部 CSS 只要有一支沒到位（離線、SW 殼快取沒建完、部署漏檔），第一次繪製就會是**純白**。
     2026-08-26 用本機真 Chrome（--headless=new + CDP 逐幀取樣）實測：
       三支 CSS 全部 404 時，**沒有這一塊的首幀是 #ffffff，有這一塊是 #0b0d12**。
     ⚠️ 變數的**落地值不在這裡**，在下面那一塊（它必須排在 splash.css 之後才蓋得過範本的預設值
        「範／App 範本／#241f1b」）。這裡只放「連 splash.css 都沒載到」時要用的後備字面值。
     ⚠️ 符號的字色刻意不在這裡：它是 js/splash-boot.js 的 onColor() 算出來的，不是設定項。

     ⭐ 2026-08-27 追加「非阻塞 CSS 的閘門」（v1.5.0）：Benson 的螢幕錄影逐格拆開後發現，
        iOS 大約在 0.50s 就開始把自己的啟動畫面**淡出**，而我們 0.73s 才第一次繪製
        ⇒ 中間露出 WKWebView 的白底。那是**賽跑**不是漸進優化：趕在淡出前畫出第一幀，
        白色會整個消失。所以三支樣式表改成非阻塞（media="print"），
        代價是熱啟動在 CSS 到齊前會露出沒套樣式的 DOM ⇒ 由 js/splash-boot.js 掛上
        html[data-cssgate]，用下面兩條規則壓住（底色仍然是深的，絕不可以是白的）。
        ⚠️ 閘門只有 JS 關得起來 ⇒ JS 被停用或 splash-boot.js 沒載到時，
           html 上根本不會有 data-cssgate，畫面照常顯示。

     ⭐⭐ 2026-08-27 v1.6.0：**第一幀從深色改成白色**（Benson 拍板的「白起」開場）。
        這一整塊上面寫的「第一次繪製必定是深色」那句話，在這一版被**刻意反過來**了，
        理由是那場賽跑我們沒有贏 —— 他的螢幕錄影逐格（59.94fps）拆開是這樣：
          0 → 0.50s   iOS 自己的啟動畫面（純黑）
          0.50 → 0.73s **平滑淡到 #ebebeb**（iOS 把自己那張圖淡出、淡進 WKWebView）
          0.73s       硬切成 #0b0d12 的深色開場 ← **就是這個硬切讓人覺得閃了一下**
        那個白不是「瀏覽器還沒畫」的空白（那會是硬切），是一段**平滑漸變**；
        我們畫得再快也還是排在它後面。所以這一版不再跟它搶，改成**接住它**：
        第一幀就是 #ebebeb，然後 700ms 平順沉成 #0b0d12，「雷」在過程中浮出來。
        ⇒ **白不再是意外，是開場的第一拍**，畫面上沒有任何硬切點可以「閃」。

        ⚠️ 舊契約「關鍵路徑的後備底色 === manifest.background_color」**沒有被放寬，是換了對象**：
           現在 manifest（#0b0d12）對應的是**開場沉到最後的底色**，
           以及熱啟動／閘門關著那兩段（那兩段本來就不播開場，該是 App 自己的深色）。
           **第一幀**的顏色由 <html data-splash-intro="light"> 決定，走 var(--sp-start,#ebebeb)。
        ⚠️ 我們**刻意不改 manifest.background_color**（那是另一條路 C1：連 iOS 系統啟動圖
           一起變白、完全沒有接縫，但**要 Benson 把 App 從主畫面移除重加**。他選了不用重加的這一版）。
        ⚠️ 漸變本體在 css/splash.css §7（非阻塞），所以三支 CSS 全掛時畫面會**停在白色**
           直到開場被收掉。這是刻意的取捨：關鍵路徑塊只放「靜止的第一幀」，不放動畫
           —— 放了就是同一條規則活在兩個地方，換色時必分岔。 -->
<style>
  html:not([data-splash="off"]),
  html[data-cssgate]{background:var(--splash-bg,#0b0d12);}
  /* 白起：開場播放中（冷啟動、還沒收場）第一幀就是 iOS 淡出後留下的那片白。
     ⚠️ 這兩條的後備值 #ebebeb 必須跟 css/splash.css 的 --sp-start 一致（t14 §75b 在比對）。 */
  html[data-splash-intro="light"]:not([data-splash="off"]){background:var(--sp-start,#ebebeb);}
  html[data-splash-intro="light"] #splash{background:var(--sp-start,#ebebeb);}
  /* 減少動態：白起整個關掉、退回深色第一幀（理由在 css/splash.css §7f —— 沒有漸變的話，
     白只是多跳一次）。這一塊也要有，不然 reduce 使用者會看到「白一下下 → 深」。 */
  @media (prefers-reduced-motion:reduce){
    html[data-splash-intro="light"]:not([data-splash="off"]),
    html[data-splash-intro="light"] #splash{background:var(--splash-bg,#0b0d12);}
  }
  /* 全掃描不是白名單：body 底下除了開場以外一律先壓住，
     以後多加一個浮動元素也不會漏 */
  html[data-cssgate] body > *:not(#splash){visibility:hidden;}
  /* ⭐⭐ v1.6.1：開場**播放中**，App 內容一律不要畫出來。
     ------------------------------------------------------------
     為什麼加這一條：Benson 的螢幕錄影在「splash.css 被套用」的那兩格
     （畫格 89–90）拍到畫面**下緣露出一條深色的 App 內容**（看得到電影卡片）。
     時間點對得起來的原因是：閘門（data-cssgate）**正好就是在那一刻開的**
     ——三支樣式表回報完成 → boot 開閘 → App 內容從 visibility:hidden 變成可見。
     ⇒ 只要有任何一塊畫面沒被 #splash 蓋到，它就會在**那一格**從
       「白色的 html 底」變成「深色的 App 內容」。
     ⚠️ 本機真 Chrome（390x844 模擬 iPhone、逐 rAF 取樣）**量不到**沒蓋滿：
        每一次取樣 #splash 的 rect 都是 0,0,390,844。所以真正的成因（iOS 的
        fixed containing block／safe-area／合成層）**沒有被複現，是推論**。
        這一條的作用是把整類問題**結構性地消掉**：開場播放中 App 根本不畫，
        蓋不蓋得滿就不再是正確性的前提。
     ⚠️ 三個一定要一起看的性質（少一個就會變成「App 永遠看不見」）：
       ① 只在**冷啟動**成立 —— 熱啟動時 boot 在 body 解析前就掛了 data-splash="off"。
       ② `#splash.out`（收場淡出）一開始就放行，App 才有得跟它交叉淡入
          （splash.js 是同一行 addClass("out") ＋ startBoot()）。
       ③ #splash 一從 DOM 移除，這條選擇器就再也匹配不到 ⇒ boot 的 7 秒交棒保險絲
          與 app.js 的 splashFallback() 都能把畫面救回來。
     ⚠️ JS 被停用時 <html> 上不會有 data-splash ⇒ 這條會匹配 ⇒ App 會被藏死。
        所以下面 <noscript> 那塊**必須**同時把它解除（那裡有配套的 !important 覆寫）。
     ⚠️ 用兄弟選擇器（~）是因為 #splash 是 <body> 的第一個子元素；
        新增元素請一律加在 #splash **後面**。 */
  html:not([data-splash="off"]) #splash:not(.out) ~ *{visibility:hidden;}
  #splash{
    position:fixed; inset:0; z-index:200; overflow:hidden;
    background:var(--splash-bg,#0b0d12); color:var(--splash-ink,#f3f5f9);
    user-select:none; -webkit-user-select:none;
  }
  html[data-splash="off"] #splash{display:none;}
  .sp-core{position:absolute; inset:0;}
  /* 第一幀＝靜止的置中符號方塊，位置與尺寸逐字照 css/splash.css（對得準系統開場的 icon） */
  .sp-glyph{
    position:absolute; left:50%; top:50%;
    width:76px; height:76px; margin:-38px 0 0 -38px;
    border-radius:22px; background:var(--splash-accent,#ffc14d);
    /* ⚠️ 字色只「引用」不「宣告」：值是 js/splash.js 的 onColor(accent) 在 <head> 就算好寫進
       :root 的 inline style 的（跟著鑰匙圈換色，最差對比有下界）。
       這裡如果寫死一個色碼，就變成同一條規則活在兩個地方，換色時一定分岔。
       splash.js 也沒載到的話這行會失效、退回繼承 --splash-ink——那是雙重降級，可以接受。 */
    color:var(--splash-on-accent);
    display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:800; letter-spacing:.02em;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .sp-glyph::before{content:var(--splash-glyph,"雷");}
  .sp-below{
    position:absolute; left:0; right:0; top:50%;
    margin-top:58px; padding:0 26px; text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  /* ⭐⭐ v1.6.1：這一塊畫的是**動畫的起始狀態**，不是完成態。
     ------------------------------------------------------------
     三支樣式表是非阻塞的 ⇒ 時序一定是
       第一次繪製（這一塊畫的）→ 幾十毫秒～數百毫秒 → css/splash.css 被套用 → 動畫從頭跑。
     這一塊以前畫「完成態」（符號實心、名字看得見），所以 splash.css 一到就會跳回起始狀態：
     Benson 的螢幕錄影逐格（59.94fps）拍到的就是這個 ——
       畫格 84–88 金色「雷」實心、名字已經看得到（淺色字壓在淺灰底上像鬼影）
       畫格 89    「雷」突然變半透明、名字整個消失          ← splash.css 在這一格套上
       畫格 91→   「雷」慢慢變回實心、名字之後才正常淡入
     ⇒ 修法是**讓第一幀等於起始狀態**：名字 opacity:0、白起時符號也 opacity:0。
       splash.css 一套上來就是「接著演」，沒有任何東西需要跳。
       （對應的另一半在 css/splash.css：那幾條進場動畫的 fill-mode 改成 both，
         起點交給這裡的靜態值、終點交給動畫自己撐。）

     ⚠️⚠️ 這裡放棄了一個舊的好處，PM 2026-08-27 拍板：
       舊版畫完成態是為了「三支 CSS 全 404 時仍然看得到一個像樣的開場」。
       **那個好處放棄了** —— CSS 404 是罕見故障，這個跳動是**每一次開 App 都會發生**。
       用「每次都醜」換「罕見情況下比較好看」不划算。
       CSS 全 404 時現在只剩：第一幀的底色（#ebebeb）＋ 符號方塊（白起時它也是隱形的）
       ＋ splash-boot.js 的 7 秒保險絲把開場收掉、App 正常可用。t14 §75d 釘住這個新期望值。

     ⚠️ --lift／--scale-in 是 css/motion.css 的 token，刻意**不寫後備字面值**：
       motion.css 也沒到位時 var() 代換失敗 ⇒ 整條宣告無效 ⇒ transform 退回 none，
       而 opacity 仍然是 0（看不見），所以視覺上沒有差別。
       寫死後備值才會變成「同一個數字活在兩個地方」，改 token 時必分岔。 */
  .sp-name{
    font-size:20px; font-weight:700; letter-spacing:-.01em; line-height:1.3;
    /* ＝ css/splash.css @keyframes sp-up 的 from（兩種變體的名字都從這裡起跑） */
    opacity:0; transform:translateY(var(--lift));
  }
  .sp-name::before{content:var(--splash-name,"好雷嗎?");}
  /* 白起：符號也是浮出來的 ⇒ 第一幀還沒出現。
     （印記那一版的符號第一幀本來就是實心的——s-breathe 的 from 就是 scale(1)／不透明，
       所以**不可以**把這條寫成無條件的，寫了就會把預設變體的第一幀弄成空的。）
     ＝ css/splash.css @keyframes sp-emerge 的 from。 */
  html[data-splash-intro="light"] .sp-glyph{opacity:0; transform:scale(var(--scale-in));}
  .sp-tag{display:none;}
</style>
<script>
  /* 必須在 splash-boot.js 之前 */
  window.SPLASH_CONFIG = {
    appId: "movie-library",   /* ASCII，跟 repo 同名，也跟 HLM_CFG.krAppId 一樣 */
    version: "1",             /* 改版時 +1，改版後第一次進站會再播一次開場 */
    keyringUrl: "https://xd1104.github.io/keyring/keyring.json",
    bootSelector: "#app",
    defaults: {               /* 鑰匙圈沒設、或讀不到時用這一組 */
      name: "好雷嗎?",
      glyph: "雷",
      bg: "#0b0d12",
      accent: "#ffc14d",
      ink: "#f3f5f9",
      tagline: "一頁看完值不值得看"
    }
  };
</script>
<!-- ⚠️⚠️ 這是整個 App **唯一**還站在「第一次繪製」關鍵路徑上的 JS。
     同步、不要 defer／async、不要搬到 body：它要在 body 開始解析之前把外觀寫成
     :root 的 CSS 變數（不然冷啟動會先畫預設再中途換字），並在熱啟動時掛
     data-splash="off"（不然每次都會閃一幀開場）。
     其餘的（時序、收場、鑰匙圈）在 <body> 尾端的 js/splash.js。 -->
<!-- SPLASH-BOOT-INLINE:BEGIN  ⚠️⚠️ 下面這一整段是 js/splash-boot.js 的**逐字副本**，不要手改。
     改法：改 js/splash-boot.js，然後跑 `npm run inline-boot` 重貼。
     test/t14-motion.mjs §62b 會用 SHA-256（換行正規化後）逐位元組比對，分岔就紅；
     而 js/splash-boot.js 自己又被 §74 釘在 app-template 的正本上 ⇒ 一條兩段的鎖鏈，
     onColor() 的真相來源全世界只有一個（app-template/motion/splash-boot.js）。

     為什麼要 inline 而不是 <script src>：第一次繪製之前必須到齊的**同源請求數**
     從 2 個（index.html ＋ splash-boot.js）降到 **1 個**（只剩 index.html）。
     桌機量不出差別（Service Worker 派送幾乎免費），但 iPhone 從主畫面開 PWA 時，
     每一個經過 SW 的子資源都要付一次 WKWebView 的代價 —— 那正是這一版在賭的東西。
     （影片實測：iOS 約 0.50s 開始把自己的啟動畫面淡出，我們 0.73s 才畫第一幀，
       中間那段露出 WKWebView 的白底。這是賽跑，不是漸進優化。）

     ⚠️ 仍然是**同步**、仍然在 <head>、仍然排在所有樣式表 <link> 之前。
     ⚠️ js/splash-boot.js 這支檔案**要留著**（它是本 repo 的正本來源、也是 §74 的比對對象），
        但它已經不再被 <script src> 載入，所以也**不在 sw.js 的殼快取裡**。 -->
<script>
/* ============================================================
   splash-boot.js — 開場的「第一幀」那一小段
   ------------------------------------------------------------
   ⚠️⚠️ 這支必須是 <head> 裡的**同步 script**（不要 defer、不要 async、
      不要搬到 body）。它是整個 app 唯一還站在「第一次繪製」關鍵路徑上的
      JS —— 所以它刻意很小，而且**只做四件事**：

        ① 讀 localStorage 的外觀快取（名字／符號／顏色）
        ② 把外觀寫成 :root 上的 CSS 變數
        ③ 冷／熱啟動判斷；熱啟動立刻掛 html[data-splash="off"]
        ④ 非阻塞 CSS 的閘門（data-cssgate）＋兩條保險絲

   為什麼要拆成兩支（2026-08-27，Benson 螢幕錄影逐格分析之後）：
     iPhone 從主畫面開 PWA 的順序是
       iOS 自己的啟動畫面（純黑）→ 約 0.5s 開始**淡出**、淡進 WKWebView
       → 我們的頁面如果還沒畫出任何東西，這一段就是 WebView 的白底
       → 我們第一次繪製（實測 0.73s）。
     所以那個白**不是「瀏覽器還沒畫」的瞬間空白，是一場賽跑**：
     只要趕在 iOS 開始淡出之前畫出第一幀，白色會整個消失、不是變短。
     舊版的 <head> 裡站著三支 CSS <link> ＋ 一支 17KB 的 splash.js，
     四個檔案全部是「畫出第一幀之前非到齊不可」。現在只剩這一支。

   ⚠️ 為什麼不能 defer／async：
     defer 之後外觀變數會在**第一次繪製之後**才寫進去
     ⇒ 冷啟動會「先畫預設值、再跳成鑰匙圈設定的名字」（中途換字，不可退步的鐵律）；
     ⇒ 熱啟動會先畫一幀開場再抽掉（每次切回來都閃一下）。

   ⚠️ onColor()（符號字色的算法）**只准存在這一份**。
      motion/splash.js 用的是這裡交出去的那一個，不是自己再寫一份。
      同一條規則活在兩個地方，鑰匙圈換色時一定分岔，而分岔的那一份沒有對比度下界。
      `node motion/check-splash.js` 會守這件事（splash.js 裡不可以有第二個 onColor）。

   對內（給 motion/splash.js 用，不是公開 API）：window.SplashBoot
   公開 API 仍然是 window.Splash（由 motion/splash.js 定義）。
   ============================================================ */
(function () {
  "use strict";

  var W = window;
  var D = document;
  var root = D.documentElement;
  var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };

  /* iOS Safari 要有 touch 監聽，:active 才會生效
     （沒有這一行，手機上所有按下回饋都是死的）。
     刻意放在 boot 不放 splash.js：splash.js 現在在 body 尾端，
     萬一它沒載到，按下回饋不應該跟著一起死。 */
  try {
    D.addEventListener("touchstart", function () {}, { passive: true });
  } catch (e) {
    D.addEventListener("touchstart", function () {}, false);
  }

  /* ============================================================
     0. 設定
     ============================================================ */
  var CFG = W.SPLASH_CONFIG || {};
  var APP_ID = CFG.appId || "app";
  var APP_VER = String(CFG.version == null ? "1" : CFG.version);
  var KEYRING_URL = has(CFG, "keyringUrl")
    ? CFG.keyringUrl
    : "https://xd1104.github.io/keyring/keyring.json";
  var SPLASH_SEL = CFG.splashSelector || "#splash";
  var BOOT_SEL = CFG.bootSelector || "#app";
  var DEFAULTS = CFG.defaults || {};

  /* localStorage：外觀快取。key 由 PM 定死，不可以自己改。 */
  var CACHE_KEY = "splash:" + APP_ID;
  /* sessionStorage：冷啟動判斷。帶版本是為了改版後第一次進站再播一次。 */
  var SEEN_KEY = "splash-seen:" + APP_ID + ":" + APP_VER;

  var REDUCE = false;
  try {
    REDUCE = !!(W.matchMedia && W.matchMedia("(prefers-reduced-motion: reduce)").matches);
  } catch (e) {}

  var nowFn =
    W.performance && typeof W.performance.now === "function"
      ? function () { return W.performance.now(); }
      : function () { return Date.now(); };
  /* ⭐ t0 要在**這裡**取，不可以在 splash.js 取：splash.js 現在跑得比較晚，
     用它自己的起點算「最短顯示」會讓開場整段往後多停一截。 */
  var t0 = nowFn();
  function elapsed() { return nowFn() - t0; }

  /* ============================================================
     1. 外觀資料的清洗（鑰匙圈是外部來源，一律當成不可信）
     ------------------------------------------------------------
     每個欄位都可能不存在或是空字串 → 一律 fallback 到 app 的預設值。
     缺欄位不是錯誤，不要報錯、不要在 console 留紅字。
     ============================================================ */
  /* 契約只收 3 碼與 6 碼：開場底色帶 alpha 沒有意義（下面是空的），不該進契約。 */
  var RE_COLOR = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;

  /* 丟掉控制字元（含換行——CSS 字串裡不能有），再去頭尾空白、截長度。
     刻意用迴圈不用正則的控制字元類別：原始碼裡不要出現真的控制字元。 */
  function txt(v, max) {
    if (v == null) return "";
    var raw = String(v);
    var s = "";
    for (var i = 0; i < raw.length; i++) {
      var c = raw.charCodeAt(i);
      if (c < 32 || c === 127) continue;
      s += raw.charAt(i);
    }
    s = s.replace(/^\s+|\s+$/g, "");
    return s.length > max ? s.slice(0, max) : s;
  }
  function col(v) {
    var s = txt(v, 12);
    return RE_COLOR.test(s) ? s : "";
  }
  function oneChar(v) {
    var s = txt(v, 8);
    if (!s) return "";
    /* 用 Array.from 才不會把 emoji／罕用字的代理對切成半個字 */
    var arr = typeof Array.from === "function" ? Array.from(s) : s.split("");
    return arr[0] || "";
  }

  /* ⭐ 符號字色：白字與深字各算一次 WCAG 對比度，取高的那個；
     近乎平手時偏好白字（見下方 15% 規則）。
     （PM 2026-08-25 拍板：符號本身的文字色「不進契約、不讓使用者設定」。
       多一個色票就多一種「調成看不見」的可能——keyring 踩過主要按鈕
       變透明、純功能測試抓不到的雷。自動算才有下界。
       這段程式碼與鑰匙圈後台的預覽縮圖是同一份，改的話兩邊要一起改，
       否則 Benson 在後台看到的跟實機不一樣。）

     ⚠️ 不要改回「亮度 > 門檻」那種猜法——飽和的綠／青會被誤判成暗底而給白字，
        實測最差只有 2.08:1（全色域 6.8% 低於 3:1）。這裡的 gamma 校正不是裝飾。
     ⭐ 這個做法可靠的理由不是「亮度猜得準」，而是
        「取兩個候選中對比較高的那個，所以最差情況有下界」。
        含 15% 平手偏白之後，全色域「窮舉」16,777,216 色實測最差 3.95:1 @ #438c83，
        0.000% 低於 3:1。
        ⚠️ 這個數字一定要用窮舉量：抽樣（step 8）會給出假的最差色 4.28:1 @ #e04000，
           比真值樂觀 8%，而且指向錯的顏色。
     ⚠️⚠️ 這是**全專案唯一一份** onColor()。2026-08-27 拆檔時它從 splash.js 搬到這裡，
        splash.js 不可以再寫一份、app 的 index.html 也不可以 inline 一份。 */
  function relLum(hex){
    var h = String(hex||"").replace("#","");
    /* 4 碼／8 碼帶 alpha：丟掉 alpha 再算。
       契約已經收窄成只收 3 碼與 6 碼（見 RE_COLOR），這裡仍然要正確處理——
       不要因為上游收窄了就假設不會發生。
       舊版對 4/8 碼一律 return 0（當成純黑）⇒ 永遠給白字，
       #ffffffff 會變成白字白底 1.00:1，「有下界」的保證整個破功。 */
    if(h.length === 4){ h = h.slice(0,3); }
    if(h.length === 8){ h = h.slice(0,6); }
    if(h.length === 3){ h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    if(!/^[0-9a-fA-F]{6}$/.test(h)){ return 0; }
    var c = [0,2,4].map(function(i){
      var v = parseInt(h.substr(i,2),16) / 255;
      return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
    });
    return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
  }
  function contrast(l1, l2){
    var hi = Math.max(l1,l2), lo = Math.min(l1,l2);
    return (hi + 0.05) / (lo + 0.05);
  }
  var ON_LIGHT = "#ffffff";
  var ON_DARK  = "#1a1310";
  function onColor(bg){
    var L = relLum(bg);
    var w = contrast(1, L);               /* 白字 */
    var d = contrast(relLum(ON_DARK), L); /* 深字 */
    if(w >= d){ return ON_LIGHT; }
    /* 近乎平手（差距 <15%）時偏好白字：兩者都夠讀，但深字會讓符號從
       「發光的徽章」變成「挖空的洞」，跟開場其餘的淺色字分屬兩套語言。
       ⚠️ 這個 15% 是拿「最差對比」換來的，動它之前先跑全色域斷言。 */
    return (d - w) / d < 0.15 ? ON_LIGHT : ON_DARK;
  }

  /* 把任意來源（鑰匙圈的 splash 物件 / 快取 / app 預設）洗成同一個形狀。
     只留下有值的欄位，空字串一律丟掉 ⇒ 合併時自然會 fallback。 */
  function clean(o) {
    var s = o && typeof o === "object" ? o : {};
    var out = {};
    var name = txt(s.name, 24);      if (name) out.name = name;
    var glyph = oneChar(s.glyph);    if (glyph) out.glyph = glyph;
    var tag = txt(s.tagline, 48);    if (tag) out.tagline = tag;
    var bg = col(s.bg);              if (bg) out.bg = bg;
    var accent = col(s.accent);      if (accent) out.accent = accent;
    var ink = col(s.ink);            if (ink) out.ink = ink;
    return out;
  }
  function isEmpty(o) {
    for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) return false; }
    return true;
  }
  function merge(base, over) {
    var out = {};
    var k;
    for (k in base) { if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k]; }
    for (k in over) { if (Object.prototype.hasOwnProperty.call(over, k)) out[k] = over[k]; }
    return out;
  }

  /* ============================================================
     2. 快取（localStorage）
     ------------------------------------------------------------
     隱私模式／存取被擋時全部安靜失敗——開場不可以因為存不了東西就掛掉。
     ============================================================ */
  function readCache() {
    try {
      var raw = W.localStorage.getItem(CACHE_KEY);
      if (!raw) return {};
      return clean(JSON.parse(raw));
    } catch (e) {
      return {};
    }
  }
  function writeCache(look) {
    try { W.localStorage.setItem(CACHE_KEY, JSON.stringify(look)); } catch (e) {}
  }
  function dropCache() {
    try { W.localStorage.removeItem(CACHE_KEY); } catch (e) {}
  }

  /* ============================================================
     3. 套用外觀（只動 :root 上的 --splash-* 變數）
     ------------------------------------------------------------
     ⭐ 只影響開場那一幕。不碰 app 的品牌色、標題、manifest、theme-color。
     文字要包成 CSS 字串（splash.css 是用 content:var(--splash-name) 畫的）。
     ============================================================ */
  function cssStr(s) {
    return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  }
  function setVar(name, value) {
    if (value) { root.style.setProperty(name, value); }
  }
  function applyLook(look) {
    setVar("--splash-bg", look.bg);
    setVar("--splash-ink", look.ink);
    if (look.accent) {
      setVar("--splash-accent", look.accent);
      /* 符號字色不是設定項，是算出來的（見 onColor） */
      setVar("--splash-on-accent", onColor(look.accent));
    }
    if (look.glyph) setVar("--splash-glyph", cssStr(look.glyph));
    if (look.name) setVar("--splash-name", cssStr(look.name));
    if (look.tagline) setVar("--splash-tagline", cssStr(look.tagline));
  }

  /* ============================================================
     4. 冷啟動判斷（只有冷啟動才播）
     ------------------------------------------------------------
     用 sessionStorage，不要用 localStorage：
     sessionStorage 的生命週期剛好等於「這一次啟動」——
     PWA 從主畫面重開＝新 session ⇒ 會播；
     切分頁、鎖屏解鎖、返回＝同一個 session ⇒ 不播。
     localStorage 會變成「一輩子只播一次」。
     ⚠️ 不准掛在 visibilitychange / focus / pageshow 上重播。
        bfcache 返回（pageshow.persisted）JS 根本不會重跑，什麼都不用做。
     ============================================================ */
  function isColdStart() {
    try {
      if (W.sessionStorage.getItem(SEEN_KEY)) return false;
      W.sessionStorage.setItem(SEEN_KEY, "1");
      return true;
    } catch (e) {
      return true; /* 隱私模式：寧可多播一次，不要整個 app 掛掉 */
    }
  }

  /* ============================================================
     5. 起手式（在 <head> 就跑完，body 還沒開始解析）
     ============================================================ */
  var builtin = clean(DEFAULTS);
  var cached = readCache();
  /* 快取優先，缺的欄位用 app 內建預設補。沒有快取就整個用內建預設。 */
  var LOOK = merge(builtin, cached);
  applyLook(LOOK);

  var COLD = isColdStart();
  if (!COLD) {
    /* 熱啟動：連一幀都不要畫出來（CSS: html[data-splash="off"] #splash{display:none}） */
    root.setAttribute("data-splash", "off");
  }

  /* ============================================================
     6. 非阻塞 CSS 的閘門（data-cssgate）
     ------------------------------------------------------------
     三支樣式表改成 media="print" onload="this.media='all'" ⇒ 它們不再擋第一次繪製。
     代價是：**熱啟動**（不播開場、直接看 app）在 CSS 到齊之前會看到
     一份沒套樣式的 DOM ＝ FOUC。所以 boot 一進來就先把閘門關上
     （關鍵路徑 CSS 裡：html[data-cssgate] #app{visibility:hidden}），
     CSS 到齊（或失敗、或保險絲燒了）才開。

     ⭐ 三條鐵律：
       ① 閘門**只有 boot 關得起來**。JS 被停用、或這支檔案沒載到 ⇒
          html 上根本不會有 data-cssgate ⇒ 畫面照常顯示。
          （守衛要寫成「有人負責開，才准關」。）
       ② 開閘條件是「每一支 link 都回報過」**或**保險絲時間到；兩條路都會
          強制把 media 改回 all —— 寧可 FOUC，也不可以把 app 永遠藏起來。
       ③ 閘門期間 <html> 的底色是 --splash-bg（深色），不是白的。
          那一段本來就是這場賽跑要贏的一段，不可以在這裡自己補一塊白。
     ============================================================ */
  var CSS_FUSE = 2000;
  var gateOpen = false;
  var domReady = false;

  root.setAttribute("data-cssgate", "");

  function deferredLinks() {
    try { return D.querySelectorAll("link[data-splash-css]"); } catch (e) { return []; }
  }
  function openGate() {
    if (gateOpen) return;
    gateOpen = true;
    /* 強制收尾：onload 沒觸發（某些 Safari 版本對 media 切換的怪癖）
       也要把樣式套上去，否則 app 會永遠是裸的 HTML。 */
    var ls = deferredLinks();
    for (var i = 0; i < ls.length; i++) {
      try { if (ls[i].media !== "all") { ls[i].media = "all"; } } catch (e) {}
    }
    root.removeAttribute("data-cssgate");
  }
  function checkGate() {
    if (gateOpen || !domReady) return;
    var ls = deferredLinks();
    for (var i = 0; i < ls.length; i++) {
      if (!ls[i].getAttribute("data-css-done")) return;
    }
    openGate();   /* 一支都沒有（app 用的是傳統阻塞式 CSS）也算到齊 */
  }
  /* 由 <link onload/onerror> 呼叫。刻意掛在 window 上：行內屬性只看得到全域。
     ⚠️ 404 也要呼叫（onerror）——「CSS 不見了」不可以變成「app 永遠看不見」。 */
  W.__splashCss = function (link) {
    try {
      link.media = "all";
      link.setAttribute("data-css-done", "1");
    } catch (e) {}
    checkGate();
  };
  W.setTimeout(openGate, CSS_FUSE);   /* 保險絲：寧可 FOUC 也不可以永遠藏起來 */

  /* ============================================================
     7. 交棒保險絲：splash.js 沒載到也一定要能用
     ------------------------------------------------------------
     ⭐ splash.js 現在在 <body> 尾端 ⇒ 它離線／漏檔沒載到的機率比以前高。
        以前保險絲住在 splash.js 自己裡面（＝那支檔案沒到就沒有保險絲），
        現在挪一份到 boot：沒有人接手就自己把開場收掉。
        （呼叫端 app.js 的 window.Splash && … 守衛仍然要留，這是第二層。）
     ============================================================ */
  var TAKEOVER_FUSE = 7000;
  /* ⚠️ hardRemove() **刻意不開閘門**。
     熱啟動時 splash.js 一到 DOM ready 就會呼叫它（開場連一幀都不播），
     那時候 CSS 通常還沒到 —— 在這裡順手開閘等於把 ② 的代價又還回去，
     熱啟動會露出沒套樣式的 DOM。閘門只有兩個開法：CSS 全回報，或 2 秒保險絲。
     （2026-08-27 §78c 實測抓到：原本寫在這裡，熱啟動的閘門 0ms 就開了。） */
  function hardRemove() {
    try {
      var sp = D.querySelector(SPLASH_SEL);
      if (sp && sp.parentNode) { sp.parentNode.removeChild(sp); }
      root.setAttribute("data-splash", "off");
    } catch (e) {}
  }
  W.setTimeout(function () {
    if (W.__splashTakeover) { return; }   /* splash.js 有接手，交給它 */
    hardRemove();
    /* 沒有人接手＝這一頁大概也出了別的事，閘門一起開掉，不要留一片空白 */
    openGate();
  }, TAKEOVER_FUSE);

  function onDomReady(fn) {
    if (D.readyState === "loading") {
      D.addEventListener("DOMContentLoaded", fn, { once: true });
    } else {
      fn();
    }
  }
  onDomReady(function () { domReady = true; checkGate(); });

  /* ============================================================
     8. 交給 motion/splash.js（不是公開 API）
     ============================================================ */
  W.SplashBoot = {
    appId: APP_ID, appVer: APP_VER, keyringUrl: KEYRING_URL,
    splashSel: SPLASH_SEL, bootSel: BOOT_SEL,
    cacheKey: CACHE_KEY, seenKey: SEEN_KEY,
    cold: COLD, reduce: REDUCE, look: LOOK, cached: cached,
    t0: t0, elapsed: elapsed, now: nowFn,
    onColor: onColor, relLum: relLum, contrast: contrast,
    clean: clean, merge: merge, isEmpty: isEmpty,
    applyLook: applyLook,
    readCache: readCache, writeCache: writeCache, dropCache: dropCache,
    hardRemove: hardRemove, openCssGate: openGate, onDomReady: onDomReady
  };
})();
</script>
<!-- SPLASH-BOOT-INLINE:END -->

<!-- ⭐ 三支樣式表一律「非阻塞」載入（v1.5.0）：media="print" 讓瀏覽器不把它們算成
     render-blocking，onload 再切回 all。這是那場賽跑的第二件套
     （第一件是把 splash.js 拆出 splash-boot.js，第三件是上面的 data-cssgate 閘門）。
     ⚠️ 三件事缺一不可，各自單獨做都等於零收益（實測）。
     ⚠️ 順序仍然不可以動：app.css → motion.css → splash.css。
        motion.css 排在 app.css 後面是刻意的（同權重時後宣告者勝）；
        splash.css 要吃 motion.css 的 --dur-* token，所以一定排在它後面。
        media="print" 不影響 CSSOM 的順序，順序看的是文件位置。
     ⚠️ motion.css 只有動效、沒有任何顏色 —— 範本那份的色票變數跟這支 App 撞名
        （--bg / --surface / --muted / --line），整包抄會把配色蓋掉。
     ⚠️ onerror 也要回報：CSS 404 不可以變成「App 永遠看不見」。
     ⚠️ 下面 noscript 的三行是給「JS 被停用」的：那時 onload 不會跑、media 永遠是 print。 -->
<link rel="stylesheet" href="./css/app.css" media="print" data-splash-css
      onload="this.media='all';window.__splashCss&amp;&amp;window.__splashCss(this)"
      onerror="window.__splashCss&amp;&amp;window.__splashCss(this)">
<link rel="stylesheet" href="./css/motion.css" media="print" data-splash-css
      onload="this.media='all';window.__splashCss&amp;&amp;window.__splashCss(this)"
      onerror="window.__splashCss&amp;&amp;window.__splashCss(this)">
<link rel="stylesheet" href="./css/splash.css" media="print" data-splash-css
      onload="this.media='all';window.__splashCss&amp;&amp;window.__splashCss(this)"
      onerror="window.__splashCss&amp;&amp;window.__splashCss(this)">
<noscript>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/motion.css">
  <link rel="stylesheet" href="./css/splash.css">
  <!-- JS 停用時沒有人會把開場收掉（收屍在 js/splash.js 裡），
       全螢幕的 #splash 會永遠卡在畫面上＝App 打不開。直接不要畫它。
       ⚠️ 第二條是配套：關鍵路徑塊的「開場播放中不畫 App」靠的是
          html[data-splash="off"]，而那個屬性只有 JS 掛得上去。
          JS 停用時它不存在 ⇒ 那條會匹配 ⇒ App 會被藏死。這裡把它解除。 -->
  <style>#splash{display:none !important;} #splash ~ *{visibility:visible !important;}</style>
</noscript>
<style>
  /* ⭐ 開場外觀的落地值就這一塊（其餘一律不用動 css/splash.css）。
     ⚠️ 這一塊**必須留在 css/splash.css 的 <link> 後面**：splash.css 是範本複製品，
        它的 :root 預設值是範本自己的品牌，同權重時後宣告者勝，搬到前面去就會被它蓋掉。
        （上面那塊關鍵路徑 CSS 才是排在 <link> 之前的，那塊刻意不宣告任何 --splash-*。）
     ⚠️ --splash-bg 必須**逐字**等於 manifest.webmanifest 的 background_color
        與上面那行 meta theme-color，否則 iPhone 從主畫面開 App 會白閃一下
        （iOS 會先畫一張用 background_color 的系統開場，關不掉）。
        剛好三處本來就都是 #0b0d12 ⇒ manifest 不用改、他也不必把 App 從主畫面移除重加。
        test/t14-motion.mjs 會逐字比對這三處。
     ⚠️ 符號的文字色**不在這裡也不是設定項**，由 js/splash.js 的 onColor() 從 accent 算出來。 */
  :root{
    --splash-bg:#0b0d12;      /* = manifest.background_color = --bg */
    --splash-ink:#f3f5f9;     /* = --text */
    --splash-accent:#ffc14d;  /* = --gold */
    /* ⭐ 符號與名字也在這裡再寫一次（splash.js 平常會用 :root 的 inline style 蓋過去）。
       為什麼要重複：css/splash.css 是範本的複製品，它的預設值是「範／App 範本」。
       萬一 splash.js 載不到、splash.css 卻載到了（第一次進站、還沒有 SW、網路不穩），
       畫面上會出現**別人家的品牌**。寫在這裡的話，最壞情況也只是「靜止的好雷嗎開場」。 */
    --splash-glyph:"雷";
    --splash-name:"好雷嗎?";
    --splash-tagline:"一頁看完值不值得看";
  }
</style>
</head>
<body>

<!-- 開場畫面。文字（符號、名字、標語）是 CSS 用 content:var(--splash-*) 畫出來的，
     所以這幾個元素刻意是空的 —— 不要把名字寫死在這裡。
     aria-hidden：開場是純視覺的，不要讀給輔助技術聽。 -->
<div id="splash" aria-hidden="true">
  <div class="sp-core">
    <div class="sp-ring"></div>
    <div class="sp-glyph"></div>
    <div class="sp-below">
      <div class="sp-name"></div>
      <div class="sp-tag"></div>
    </div>
  </div>
</div>

<div id="app">

  <!-- ============ 片單／搜尋頁 ============ -->
  <section id="view-home">
    <div class="brand">
      <h1>好雷嗎<span class="dot">?</span></h1>
      <small>一頁看完這部片值不值得看</small>
      <button class="iconbtn" id="gear" aria-label="設定">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.05 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.1a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>

    <div class="stickyhead" id="stickyhead">
      <form class="searchbox" id="sform" autocomplete="off" action="#">
        <button type="submit" class="sicon" aria-label="搜尋">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9aa3b4" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
        </button>
        <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="查特定電影，例如：沙丘" aria-label="搜尋電影">
        <button type="button" class="clearbtn hide" id="clr" aria-label="清除">✕</button>
      </form>
      <div class="tabs" id="tabs" role="tablist">
        <button class="tab" data-tab="cinema" role="tab" type="button">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 12h18"/></svg>
          電影院
        </button>
        <button class="tab" data-tab="stream" role="tab" type="button">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>
          串流
        </button>
      </div>
    </div>

    <div class="body">
      <div id="pfWrap" class="hide"><div class="pfbar noscroll" id="pfbar"></div></div>
      <div id="recentWrap" class="hide" style="margin-top:14px;">
        <p class="sec-title">最近查詢</p>
        <div class="chips" id="recent"></div>
      </div>
      <div class="listhead" id="listhead">
        <p class="sec-title" id="listTitle"></p>
        <button class="sortbtn hide" id="sortbtn" type="button"></button>
      </div>
      <p class="hintline" id="hintline"></p>
      <div class="rowlist" id="list"></div>
      <div id="emptyBox"></div>
    </div>
  </section>

  <!-- ============ 詳細頁 ============ -->
  <section id="view-detail">
    <div class="dtop" id="dtop">
      <button class="backbtn" id="back" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        <span id="backlabel">返回</span>

      <span class="dtitle" id="dtitle"></span>

    <div id="dbody"></div>

  <!-- ============ 設定／第一次使用 ============ -->
  <section id="view-setup">
    <div class="dtop" id="stop">
      <button class="backbtn" id="sback" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        <span>返回</span>
      </button>
      <span class="dtitle" style="opacity:1">設定</span>
    </div>
    <div id="sbody"></div>
  </section>

  <!-- 有新版時才出現。刻意不自動 reload：他可能正在貼金鑰（見 CLAUDE.md R-2） -->
  <div class="updatebar hide" id="updatebar">
    <span class="ut">有新版本了</span>
    <button type="button" class="ub" id="doupdate">立即更新</button>
    <button type="button" class="ux" id="dismissupdate" aria-label="稍後再說">✕</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!-- ⭐ 這六支一律 defer（2026-08-26 量出來的，不是照本宣科）：
     它們加起來 ~208KB，而且第一次繪製一個位元組都用不到（畫面完全被 #splash 蓋住）。
     不加 defer 的話它們會用「解析器阻塞腳本」的高優先權去搶頻寬，
     把第一次繪製真正需要的 index.html／css／splash.js 擠到後面。
     本機真 Chrome ＋ CDP 逐幀取樣、每次取樣前清光 SW/快取/儲存空間（＝Safari 第一次開）：
       Slow-3G 冷啟動 first paint 中位 2670ms → 2225ms（-420ms，三輪重現）
       4G 冷啟動 295→277ms、走 SW 熱啟動 227→220ms（都在雜訊內，沒有退步）
     ⚠️ js/splash.js 不在這一批裡，它必須留在 <head> 當同步腳本（t14 §62 在擋）：
        它要在 body 開始解析前把外觀寫成 CSS 變數，否則會「先畫預設再中途換字」。
     ⚠️ defer 會保序執行，所以鑰匙圈仍然排在我們自己的 js 之前。 -->
<!-- 鑰匙圈（跨 App 身分模組）：一定要在我們自己的 js 之前載入。
     它是 xd1104/keyring 的 client/keyring-unlock.js 複製過來的，**不要在這裡改它**，
     要改去那個 repo 改（我們這邊也不可以寫任何 kr- 開頭的 CSS）。 -->
<!-- ══════════ 開場的其餘部分（時序、收場、鑰匙圈）══════════
     ⭐ v1.5.0 從 <head> 搬到這裡：它有 17KB，而第一次繪製一個位元組都用不到
        （第一幀的長相全在 <head> 的關鍵路徑 CSS，外觀變數由 js/splash-boot.js 設好）。
     ⚠️ 仍然是**同步** script，而且必須排在下面那六支 defer 之前 ——
        app.js 一開頭就會呼叫 Splash.hold()，window.Splash 那時候必須已經存在。
        （同步 script 一定跑在 defer 之前，所以順序成立。）
     ⚠️ 沒載到也不可以把 App 弄死：app.js 一律 window.Splash && …，
        而且 js/splash-boot.js 自己有一條 7 秒的交棒保險絲會把開場收掉。 -->
<script src="./js/splash.js"></script>
<script defer src="./js/keyring-unlock.js"></script>
<script defer src="./js/config.js"></script>
<script defer src="./js/store.js"></script>
<script defer src="./js/api.js"></script>
<script defer src="./js/ui.js"></script>
<script defer src="./js/app.js"></script>
</body>
</html>
