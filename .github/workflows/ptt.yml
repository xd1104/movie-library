# 每天抓一次 PTT 電影板的鄉民評價，產出 data/ptt-movie.json 並 commit 回 repo。
#
# 為什麼要用 Actions：App 是純靜態網頁，瀏覽器不能直接抓 PTT（跨網域被擋）。
# 公開 repo 的 Actions 免費不限量，不用養伺服器。
#
# ⚠️ 需要一個 secret：TMDB_KEY
#    repo → Settings → Secrets and variables → Actions → New repository secret
#    名稱 TMDB_KEY，值是 TMDB 的 API Key (v3 auth) 那組 32 碼。
#    沒設的話這個 workflow 會直接失敗並告訴你去哪裡設（不會安靜產出空檔案）。
name: 抓 PTT 電影板評價

on:
  schedule:
    # 台灣時間每天 03:30 = UTC 19:30（避開 PTT 尖峰時段）
    - cron: "30 19 * * *"
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下，方便測

permissions:
  contents: write           # 要把 data/ptt-movie.json commit 回 repo

concurrency:
  group: ptt-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 爬蟲自己會做健康檢查：抓到 0 篇文章、或 0 篇帶得到雷標籤，
      # 就會 exit 1 並印出診斷（URL、HTTP 狀態、HTML 前 500 字）。
      # 那時這一步會紅，下面的 commit 步驟不會跑 —— 這是刻意的。
      # 不要讓它「失敗也繼續」：安靜產出一份空檔案比整個 job 紅掉更糟。
      - name: 抓 PTT 電影板
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node scripts/fetch-ptt.mjs

      - name: 有變動才 commit
        run: |
          if [ -z "$(git status --porcelain data/ptt-movie.json)" ]; then
            echo "內容沒變，這次不 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ptt-movie.json
          git commit -m "資料：更新 PTT 電影板評價"
          git push
